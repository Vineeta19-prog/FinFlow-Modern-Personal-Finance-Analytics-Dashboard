<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FinFlow+ | Pro Dashboard</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;800&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body data-theme="light">
    <div class="app-container">
        <aside class="glass-sidebar">
            <div class="logo"><i data-lucide="wallet"></i> FinFlow<span class="plus-text">+</span></div>
            <nav>
                <div class="nav-item active" onclick="showView('dashboard')"><i data-lucide="layout-dashboard"></i> Dashboard</div>
                <div class="nav-item" onclick="showView('analytics')"><i data-lucide="pie-chart"></i> Analytics</div>
                <div class="nav-item" onclick="showView('settings')"><i data-lucide="settings"></i> Settings</div>
            </nav>
            <div class="sidebar-footer">
                <button id="themeToggle" class="icon-btn"><i data-lucide="moon" id="themeIcon"></i></button>
                <div class="role-pill">
                    <select id="roleSelect" onchange="handleRoleChange(this.value)">
                        <option value="admin">Admin Mode</option>
                        <option value="viewer">Viewer Mode</option>
                    </select>
                </div>
            </div>
        </aside>

        <main class="main-content">
            <div id="dashboard-view" class="view-section">
                <header class="main-header">
                    <div><h1>Wealth Overview</h1><p>Monitor your cash flow.</p></div>
                    <button id="addBtn" class="premium-btn"><i data-lucide="plus"></i> New Entry</button>
                </header>
                <div class="stats-grid">
                    <div class="stat-card glass"><span class="label">Balance</span><h2 id="balanceText">$0</h2></div>
                    <div class="stat-card glass"><span class="label">Income</span><h2 id="incomeText" style="color:#22c55e">$0</h2></div>
                    <div class="stat-card glass"><span class="label">Expenses</span><h2 id="expenseText" style="color:#f43f5e">$0</h2></div>
                </div>
                <div class="table-section glass">
                    <div class="table-header">
                        <h3>Recent Ledger</h3>
                        <div class="search-box"><i data-lucide="search"></i><input type="text" id="searchInput" placeholder="Search..."></div>
                    </div>
                    <table>
                        <thead><tr><th>Category</th><th>Status</th><th class="text-right">Value</th></tr></thead>
                        <tbody id="tableBody"></tbody>
                    </table>
                </div>
            </div>

            <div id="analytics-view" class="view-section" style="display: none;">
                <h1>Analytics</h1>
                <div class="glass" style="margin-top:20px; padding:30px;">
                    <h3>Income vs Expenses (Vertical Trend)</h3>
                    <div id="chartContainer" style="display:flex; align-items:flex-end; justify-content: space-around; gap:10px; height:300px; margin-top:40px; padding-bottom:20px; border-bottom:2px solid var(--border);">
                        </div>
                    <div style="display:flex; justify-content:center; gap:20px; margin-top:20px; font-size:12px; font-weight:800;">
                        <span style="color:#22c55e">● Income</span>
                        <span style="color:#6366f1">● Expense</span>
                    </div>
                </div>
            </div>

            <div id="settings-view" class="view-section" style="display: none;">
                <h1>Settings</h1>
                <div class="glass" style="margin-top:20px; max-width: 500px;">
                    <div style="margin-bottom:20px;">
                        <label style="display:block; margin-bottom:10px; font-weight:800;">Primary Currency</label>
                        <select id="currencySelect" class="role-pill" style="width:100%; padding:12px; background:var(--bg-color); border:1px solid var(--border); color:var(--text-primary);">
                            <option value="$">USD - US Dollar ($)</option>
                            <option value="₹">INR - Indian Rupee (₹)</option>
                            <option value="€">EUR - Euro (€)</option>
                            <option value="£">GBP - British Pound (£)</option>
                        </select>
                    </div>
                    <button class="premium-btn" style="width:100%; justify-content:center;" onclick="alert('Settings Saved!')">Save Preferences</button>
                </div>
            </div>
        </main>
    </div>
    <script src="script.js"></script>
</body>
</html>
